<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradOnePlusGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="screenGradOP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#061C14" />
    </linearGradient>
    <filter id="phoneShadowOP" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Curvier Body -->
  <rect x="75" y="30" width="250" height="440" rx="36" fill="url(#bodyGradOnePlusGreen)" filter="url(#phoneShadowOP)" stroke="#10B981" stroke-width="1.5" />

  <!-- Inner Bezel -->
  <rect x="82" y="37" width="236" height="426" rx="30" fill="#02140D" />

  <!-- Screen -->
  <rect x="86" y="41" width="228" height="418" rx="26" fill="url(#screenGradOP)" />
  <circle cx="200" cy="220" r="90" fill="#10B981" opacity="0.2" filter="blur(30px)" />
  <circle cx="220" cy="290" r="70" fill="#34D399" opacity="0.12" filter="blur(26px)" />

  <!-- Center Hole Punch Camera -->
  <circle cx="200" cy="56" r="6" fill="#011810" stroke="#052E16" stroke-width="1.5" />

  <!-- Clock -->
  <text x="200" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#ECFDF5" text-anchor="middle">10:08</text>
  <text x="200" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#6EE7B7" text-anchor="middle">Never Settle</text>

  <!-- Variant Badge -->
  <rect x="115" y="260" width="170" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
  <text x="200" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#A7F3D0" text-anchor="middle">OnePlus 12 • 256GB</text>

  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#6EE7B7" text-anchor="middle">Flowy Emerald • Hasselblad</text>

  <!-- Navigation bar hint -->
  <rect x="165" y="445" width="70" height="4" rx="2" fill="#FFFFFF" opacity="0.5" />
</svg>
