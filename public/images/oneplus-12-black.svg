<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradOnePlusBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="screenGradOPB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="phoneShadowOPB" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Curvier Body -->
  <rect x="75" y="30" width="250" height="440" rx="36" fill="url(#bodyGradOnePlusBlack)" filter="url(#phoneShadowOPB)" stroke="#3F3F46" stroke-width="1.5" />

  <!-- Inner Bezel -->
  <rect x="82" y="37" width="236" height="426" rx="30" fill="#050505" />

  <!-- Screen -->
  <rect x="86" y="41" width="228" height="418" rx="26" fill="url(#screenGradOPB)" />
  <circle cx="200" cy="220" r="90" fill="#E11D48" opacity="0.18" filter="blur(30px)" />
  <circle cx="180" cy="290" r="70" fill="#F43F5E" opacity="0.12" filter="blur(26px)" />

  <!-- Center Hole Punch Camera -->
  <circle cx="200" cy="56" r="6" fill="#000000" stroke="#18181B" stroke-width="1.5" />

  <!-- Clock -->
  <text x="200" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#FAFAFA" text-anchor="middle">10:08</text>
  <text x="200" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#A1A1AA" text-anchor="middle">Never Settle</text>

  <!-- Variant Badge -->
  <rect x="115" y="260" width="170" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
  <text x="200" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FECDD3" text-anchor="middle">OnePlus 12 • 512GB</text>

  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle">Silky Black • Hasselblad</text>

  <!-- Navigation bar hint -->
  <rect x="165" y="445" width="70" height="4" rx="2" fill="#FFFFFF" opacity="0.5" />
</svg>
