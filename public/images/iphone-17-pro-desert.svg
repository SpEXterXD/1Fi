<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradDesert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A087" />
      <stop offset="50%" stop-color="#E4C8B5" />
      <stop offset="100%" stop-color="#A8836C" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Shadow & Body -->
  <rect x="75" y="30" width="250" height="440" rx="42" fill="url(#bodyGradDesert)" filter="url(#phoneShadow)" stroke="#D4AF98" stroke-width="2" />

  <!-- Inner Bezel -->
  <rect x="83" y="38" width="234" height="424" rx="36" fill="#0A0D14" />

  <!-- Display Wallpaper Glow -->
  <rect x="88" y="43" width="224" height="414" rx="32" fill="url(#screenGrad)" />
  <circle cx="200" cy="200" r="90" fill="#E4C8B5" opacity="0.12" filter="blur(30px)" />
  <circle cx="160" cy="300" r="70" fill="#3B82F6" opacity="0.08" filter="blur(25px)" />

  <!-- Dynamic Island -->
  <rect x="160" y="52" width="80" height="22" rx="11" fill="#000000" />
  <circle cx="225" cy="63" r="4" fill="#0F172A" />

  <!-- Clock & Widgets Mock -->
  <text x="200" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="600" fill="#F8FAFC" text-anchor="middle">09:41</text>
  <text x="200" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">Friday, September 18</text>

  <!-- iPhone 17 Pro Badge inside screen -->
  <rect x="125" y="270" width="150" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
  <text x="200" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E4C8B5" text-anchor="middle">iPhone 17 Pro • 256GB</text>

  <!-- Desert Titanium Label -->
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Desert Titanium</text>

  <!-- Home Bar -->
  <rect x="155" y="445" width="90" height="4" rx="2" fill="#FFFFFF" opacity="0.6" />
</svg>
